[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: every route must serve the shell, or a standalone launch
# deep into the app 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served stale, or the app can pin itself to
# an old shell that no deploy can replace.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
