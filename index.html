<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ootd</title>

    <!--
      viewport-fit=cover lets the app paint under the notch and home bar; the
      safe-area insets in index.css keep content clear of them.
      user-scalable=no because pinch-zooming a wardrobe grid only ever happens
      by accident.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />

    <meta name="description" content="Outfit of the day. Your wardrobe, on your phone, and nowhere else." />
    <meta name="theme-color" content="#FAF9F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)" />

    <!-- iOS home-screen install (spec §3). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ootd" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
